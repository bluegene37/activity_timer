name: activity_timer
description: "Offline activity, interval, and coffee pour-over timer for workouts, routines, reminders, and better brews."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Gene - Oct 8, 2026: Bumped build number to +20 to supersede existing internal testing track build 1.0.0+16
# Gene - Oct 8, 2026: Bumped build number to +2 for Closed Testing release track
# version: 1.0.0+1
# version: 1.0.0+2
version: 1.0.0+20

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  audioplayers: ^6.4.0
  path_provider: ^2.1.1
  uuid: ^4.2.1
  intl: ^0.20.2
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  wakelock_plus: ^1.7.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  signals: ^7.1.0
  get_it: ^9.2.1
  go_router: ^18.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  yaml: ^3.1.2

  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  hive_ce_generator: ^1.11.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:

  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/fonts/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600


