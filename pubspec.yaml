name: activity_timer
description: "A timer with different intervals and settings for all kinds of activities."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  audioplayers: ^6.4.0
  path_provider: ^2.1.1
  uuid: ^4.2.1
  intl: ^0.20.2
  change_app_package_name: ^1.5.0
  get: ^4.7.2
  forui: ^0.17.0
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  hive_ce_generator: ^1.11.0

flutter:

  uses-material-design: true

  assets:
