# Configures the analyzer, which statically analyzes Dart code to check for
# errors, warnings, and lints.
#
# Rules are documented at https://dart.dev/lints.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Hive CE codegen output — regenerate it rather than lint it.
    - "**/*.g.dart"
  # Modern strict type checking: no implicit downcasts from `dynamic`, no
  # implicit `dynamic` from inference, and no bare generic types.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Dart 3 language style
    - unnecessary_breaks
    - unnecessary_library_name
    - use_enums
    - use_string_in_part_of_directives
    - use_super_parameters

    # API modernization
    - use_colored_box
    - use_decorated_box
    - sized_box_shrink_expand

    # Correctness
    - avoid_slow_async_io
    - avoid_void_async
    - cast_nullable_to_non_nullable
    - unawaited_futures
    - unnecessary_await_in_return

    # Consistency
    - always_declare_return_types
    - combinators_ordering
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - sort_constructors_first
    - unnecessary_parenthesis
