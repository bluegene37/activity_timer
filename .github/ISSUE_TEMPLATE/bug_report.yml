name: 🐛 Bug Report
description: Report a reproducible problem or unexpected behavior in Activity Timer.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem quickly.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform did this issue occur on?
      options:
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating System Version
      description: e.g. Android 14, iOS 17.4
      placeholder: "e.g. Android 14 / iOS 17.5"
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: Device Model
      description: e.g. Pixel 8, iPhone 15 Pro, Samsung Galaxy S23
      placeholder: "e.g. Pixel 8 Pro"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Check under Settings -> About (e.g. 1.0.0).
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Go to 'Activities'
        2. Create a routine with 3 steps
        3. Start the timer and lock the screen
        4. Unlock after 2 minutes...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (e.g. sound did not fire, timer jumped).
    validations:
      required: true

  - type: textarea
    id: logs-or-media
    attributes:
      label: Logs, Screenshots, or Recordings
      description: Paste any error messages, logs, or attach screenshots/screen recordings.
