name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Target version tag (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Build Android Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Version Alignment
        run: |
          PUBSPEC_VERSION=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          REF_TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          TAG_VERSION="${REF_TAG#v}"
          if [ -n "$TAG_VERSION" ] && [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pubspec.yaml version ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "VERSION=$PUBSPEC_VERSION" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF

      - name: Build Android App Bundle (.aab)
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols/android

      - name: Build Android Standalone APK (.apk)
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols/android

      - name: Stage Android Distribution Artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/activity-timer-${VERSION}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/activity-timer-${VERSION}.apk"
          if [ -d "build/symbols/android" ]; then
            (cd build/symbols && zip -r "$GITHUB_WORKSPACE/dist/symbols-android.zip" android)
          fi

      - name: Upload to Google Play Internal Track (optional)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.genexis.activitytimer
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*

  ios:
    name: Build iOS Artifacts
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version
        run: |
          PUBSPEC_VERSION=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          echo "VERSION=$PUBSPEC_VERSION" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build iOS Release Archive (Unsigned)
        run: >
          flutter build ipa --release --no-codesign
          --obfuscate --split-debug-info=build/symbols/ios

      - name: Stage iOS Distribution Artifacts
        run: |
          mkdir -p dist
          if [ -d "build/ios/archive" ]; then
            (cd build/ios/archive && zip -r "$GITHUB_WORKSPACE/dist/Runner-${VERSION}.xcarchive.zip" Runner.xcarchive)
          fi
          if [ -d "build/symbols/ios" ]; then
            (cd build/symbols && zip -r "$GITHUB_WORKSPACE/dist/symbols-ios.zip" ios)
          fi

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
