name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android (.aab)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        run: |
          PUBSPEC_VERSION=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $PUBSPEC_VERSION" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

      # Optional Play-store signing. Without these secrets the .aab is
      # debug-signed (fine for testing, not uploadable to Play).
      - name: Write release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=upload
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF

      - name: Build app bundle
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols/android

      - name: Stage artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/activity-timer-$VERSION.aab"
          (cd build/symbols && zip -r "$GITHUB_WORKSPACE/dist/symbols-android.zip" android)

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    name: iOS (unsigned archive)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

      # No signing certs in CI: build the archive unsigned. The store .ipa
      # is produced locally with `flutter build ipa` — see RELEASING.md.
      - name: Build archive
        run: >
          flutter build ipa --release --no-codesign
          --obfuscate --split-debug-info=build/symbols/ios

      - name: Stage artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          (cd build/ios/archive && zip -r \
            "$GITHUB_WORKSPACE/dist/Runner-$VERSION.xcarchive.zip" Runner.xcarchive)
          (cd build/symbols && zip -r "$GITHUB_WORKSPACE/dist/symbols-ios.zip" ios)

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  release:
    name: GitHub release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
