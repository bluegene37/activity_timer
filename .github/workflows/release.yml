name: Release

# Gene - Oct, 09, 2026: Added platform, track, and auto_increment_build inputs for terminal dispatch
# on:
#   push:
#     tags:
#       - 'v*'
#   workflow_dispatch:
#     inputs:
#       version_tag:
#         description: 'Target version tag (e.g., v1.0.0)'
#         required: false
#         type: string
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build and release (all, ios, android)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      track:
        description: 'Google Play track for Android (alpha, internal, beta, production, none)'
        required: false
        default: 'alpha'
        type: string
      auto_increment_build:
        description: 'Use GitHub run number as build number (avoids duplicate build numbers)'
        type: boolean
        default: true
      version_tag:
        description: 'Target version tag (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
# Gene - Oct, 09, 2026: Conditional execution for android job based on platform input
#   android:
#     name: Build Android Artifacts
#     runs-on: ubuntu-latest
  android:
    name: Build Android Artifacts
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || github.event.inputs.platform == '' || github.event.inputs.platform == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gene - Oct, 09, 2026: Only enforce tag version alignment if version_tag is specified or triggered by git tag
      # - name: Validate Version Alignment
      #   run: |
      #     PUBSPEC_VERSION=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
      #     REF_TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
      #     TAG_VERSION="${REF_TAG#v}"
      #     if [ -n "$TAG_VERSION" ] && [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
      #       echo "::error::Tag version ($TAG_VERSION) does not match pubspec.yaml version ($PUBSPEC_VERSION)"
      #       exit 1
      #     fi
      #     echo "VERSION=$PUBSPEC_VERSION" >> "$GITHUB_ENV"
      - name: Validate Version Alignment
        run: |
          PUBSPEC_VERSION=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          REF_TAG="${{ github.event.inputs.version_tag }}"
          if [ -z "$REF_TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            REF_TAG="${{ github.ref_name }}"
          fi
          if [ -n "$REF_TAG" ]; then
            TAG_VERSION="${REF_TAG#v}"
            if [ -n "$TAG_VERSION" ] && [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match pubspec.yaml version ($PUBSPEC_VERSION)"
              exit 1
            fi
          fi
          echo "VERSION=$PUBSPEC_VERSION" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Configure Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF

      # Gene - Oct, 09, 2026: Support auto_increment_build for Android bundle to prevent Google Play versionCode collisions
      # - name: Build Android App Bundle (.aab)
      #   run: >
      #     flutter build appbundle --release
      #     --obfuscate --split-debug-info=build/symbols/android
      - name: Build Android App Bundle (.aab)
        run: |
          if [ "${{ github.event.inputs.auto_increment_build }}" != "false" ]; then
            VERSION_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            BUILD_NUMBER=$(( 10 + ${{ github.run_number }} ))
            echo "Building $VERSION_NAME+$BUILD_NUMBER"
            flutter build appbundle --release \
              --build-name="$VERSION_NAME" \
              --build-number="$BUILD_NUMBER" \
              --obfuscate \
              --split-debug-info=build/symbols/android
          else
            flutter build appbundle --release \
              --obfuscate \
              --split-debug-info=build/symbols/android
          fi

      - name: Build Android Standalone APK (.apk)
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols/android

      - name: Stage Android Distribution Artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/activity-timer-${VERSION}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/activity-timer-${VERSION}.apk"
          if [ -d "build/symbols/android" ]; then
            (cd build/symbols && zip -r "$GITHUB_WORKSPACE/dist/symbols-android.zip" android)
          fi

      # Gene - Oct, 09, 2026: Upload to Google Play using track input (defaults to alpha / closed testing)
      # - name: Upload to Google Play Internal Track (optional)
      #   if: env.PLAY_JSON != ''
      #   uses: r0adkll/upload-google-play@v1
      #   env:
      #     PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: dev.genexis.activitytimer
      #     releaseFiles: build/app/outputs/bundle/release/app-release.aab
      #     tracks: internal
      #     status: completed
      - name: Upload to Google Play Track (optional)
        if: env.PLAY_JSON != '' && github.event.inputs.track != 'none'
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.genexis.activitytimer
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track || 'alpha' }}
          status: completed

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*

